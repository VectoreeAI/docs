openapi: 3.0.3
info:
  title: Vectoree Tool Hub
  version: 1.1.0
  description: |
    Hosted MCP tools. Catalog product remains `vectoree.search` (REST `/run` with `action`).
    Agent MCP `tools/list` exposes two facades: `search` and `extract` (no `action` field).
    Legacy MCP name `vectoree.search` with `action=search|extract` remains accepted on `tools/call`.

    MCP (JSON-RPC) lives at `POST /mcp` with `Authorization: Bearer sk-ve-v1-...` and `tools:*` scope.
    Preferred REST: `POST /api/tools/v1/vectoree.search/run` with `{ "action": "search"|"extract", ... }`.
    Legacy aliases `POST /api/tools/v1/search` and `/extract` remain for transition and are deprecated.
servers:
  - url: https://vectoree.ai/api
paths:
  /tool-hub/tools:
    get:
      summary: List Tool Hub catalog
      description: Dashboard-authenticated catalog of available tools.
      responses:
        '200':
          description: Tool list
  /tools/v1/vectoree.search/run:
    post:
      summary: Vectoree Search (unified)
      description: |
        Run search or extract under the Vectoree Search product.
        Body requires `action` plus Tavily-compatible fields for that action.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [search, extract]
                query:
                  type: string
                max_results:
                  type: integer
                  minimum: 1
                  maximum: 20
                urls:
                  type: array
                  items:
                    type: string
                    format: uri
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Search or extract results
  /tools/v1/search:
    post:
      summary: Web search (deprecated alias)
      description: Deprecated. Prefer `/tools/v1/vectoree.search/run` with `action=search`.
      deprecated: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                max_results:
                  type: integer
                  minimum: 1
                  maximum: 20
                time_range:
                  type: string
                  enum: [day, week, month, year]
                include_domains:
                  type: array
                  items:
                    type: string
                exclude_domains:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Search results
  /tools/v1/extract:
    post:
      summary: Web extract (deprecated alias)
      description: Deprecated. Prefer `/tools/v1/vectoree.search/run` with `action=extract`.
      deprecated: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                urls:
                  type: array
                  items:
                    type: string
                    format: uri
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Extract results
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk-ve-v1-...
