openapi: 3.0.3
info:
  title: VECTOREE Model Gateway v1
  version: 1.1.0
  description: |
    OpenAI / Anthropic / Gemini compatible Model Gateway.

    Authenticate with a **scoped project API key** (`sk-ve-v1-...`) that has
    `gateway:chat` (inference) or `gateway:models` (list). Instance master keys
    (`ik_...`) and publishable keys (`pk_`) are rejected.

    Organization wallet billing applies when enabled (default). Optional per-key
    `rpmLimit` returns HTTP 429 with `Retry-After`. Errors use the OpenAI shape
    `{ "error": { "message", "type", "code" } }`.

servers:
  - url: https://vectoree.ai
    description: Production

paths:
  /api/v1/models:
    get:
      summary: List models
      tags: [Gateway]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: |
            OpenAI-shaped model list with OpenRouter-compatible capability fields.
            Each item includes `id` / `object` / `created` / `owned_by`, Vectoree
            `inputModality` / `outputModality`, OpenRouter-style
            `architecture` / `reasoning` / `supported_parameters` / `context_length` /
            `canonical_slug` / `top_provider` (numeric only) / `per_request_limits: null`,
            and `pricing` built from **sell** rates (never inbound cost).
            Upstream channel ids and generation cost are never exposed.
        '401':
          $ref: '#/components/responses/GatewayError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/chat/completions:
    post:
      summary: Chat completions (text + multimodal input)
      description: |
        Supports vision content parts on messages (image_url).
        Set `stream: true` for SSE (`text/event-stream`) with OpenAI chunk payloads
        and a terminal `data: [DONE]` event.
        Decisions models (output modality `decisions`) are rejected with HTTP 400;
        use `POST /api/v1/systemone` (or the `/api/v1/decisions` alias) instead.
      tags: [Gateway]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                stream:
                  type: boolean
                temperature:
                  type: number
                max_tokens:
                  type: integer
                reasoning:
                  type: object
                  description: |
                    Unified reasoning controls. Mapped per upstream origin
                    (OpenRouter `reasoning`, DashScope `enable_thinking` /
                    `thinking_budget`, Anthropic `thinking`, etc.).
                  properties:
                    effort:
                      type: string
                    max_tokens:
                      type: integer
                    enabled:
                      type: boolean
                    exclude:
                      type: boolean
                reasoning_effort:
                  type: string
                  description: Legacy alias mapped to reasoning.effort
                seed:
                  type: number
                frequency_penalty:
                  type: number
                presence_penalty:
                  type: number
                parallel_tool_calls:
                  type: boolean
      responses:
        '200':
          description: |
            Chat completion or SSE stream. Response `id` is a Vectoree request id
            (not the upstream generation id). `usage` reflects Vectoree meter
            quantities; upstream `usage.cost` / provider routing fields are never
            returned.
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/responses:
    post:
      summary: OpenAI Responses API (stateless subset)
      description: Does not support `previous_response_id`.
      tags: [Gateway]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Responses payload or SSE stream

  /api/v1/messages:
    post:
      summary: Anthropic Messages API
      tags: [Gateway]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Anthropic Messages payload or SSE stream

  /api/v1/gemini/generateContent:
    post:
      summary: Gemini generateContent
      description: Model is supplied in the JSON body (not the path).
      tags: [Gateway]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gemini generateContent response

  /api/v1/gemini/streamGenerateContent:
    post:
      summary: Gemini generateContent (SSE)
      tags: [Gateway]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gemini SSE stream

  /api/v1/embeddings:
    post:
      summary: Create embeddings
      tags: [Gateway]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model:
                  type: string
                input:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                encoding_format:
                  type: string
                  enum: [float, base64]
                dimensions:
                  type: integer
      responses:
        '200':
          description: Embedding vectors

  /api/v1/systemone:
    post:
      summary: System One evaluation (Jev / TypeSafe-compatible)
      description: |
        Preferred ingress for decisions models (output modality `decisions`).
        Send `state` plus typed `questions` (noul / choice / score); response is
        structured `answers`. Compatible with TypeSafe SDKs pointed at this host
        (`baseURL` ending in `/api` → `/v1/systemone`).
        Upstream OpenRouter or TypeSafe uses `/v1/systemone`. Client-facing
        `usage` uses OpenAI field names (`prompt_tokens` / `completion_tokens`);
        upstream `input_tokens` / `output_tokens` are normalized.
      tags: [Gateway]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOneRequest'
      responses:
        '200':
          description: Structured answers and usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOneResponse'
        '400':
          $ref: '#/components/responses/GatewayError'

  /api/v1/decisions:
    post:
      summary: Structured decisions (alias of /api/v1/systemone)
      deprecated: true
      description: |
        Alias of `POST /api/v1/systemone`. Same request and response body.
        Prefer `/api/v1/systemone` for new integrations; this path remains
        supported for existing clients.
      tags: [Gateway]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOneRequest'
      responses:
        '200':
          description: Structured answers and usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOneResponse'
        '400':
          $ref: '#/components/responses/GatewayError'

  /api/v1/images:
    post:
      summary: Generate images
      description: |
        Sync by default. Pass `async: true` or `Prefer: respond-async` for a job.
        Send `Idempotency-Key` to safely retry after client/proxy timeouts.
      tags: [Gateway]
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            example: respond-async
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model:
                  type: string
                prompt:
                  type: string
                async:
                  type: boolean
                aspect_ratio:
                  type: string
                resolution:
                  type: string
                n:
                  type: integer
      responses:
        '200':
          description: Generated image payload
        '202':
          description: Async job accepted (`polling_url`)

  /api/v1/images/jobs/{jobId}:
    get:
      summary: Poll async / recoverable image job
      tags: [Gateway]
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status and result when completed

  /api/v1/videos:
    post:
      summary: Submit video generation job
      description: Asynchronous. Poll `GET /api/v1/videos/{jobId}` until status is completed.
      tags: [Gateway]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                prompt:
                  type: string
                duration:
                  type: integer
                resolution:
                  type: string
                aspect_ratio:
                  type: string
                frame_images:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Job id and polling_url

  /api/v1/videos/{jobId}:
    get:
      summary: Poll video generation job
      tags: [Gateway]
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: Optional logical model slug to pin provider routing
      responses:
        '200':
          description: Job status payload

  /api/v1/videos/{jobId}/content:
    get:
      summary: Download generated video bytes
      tags: [Gateway]
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: model
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Video binary
          content:
            video/mp4:
              schema:
                type: string
                format: binary

  /api/v1/audio/speech:
    post:
      summary: Text to speech
      tags: [Gateway]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Binary audio

  /api/v1/audio/transcriptions:
    post:
      summary: Speech to text
      tags: [Gateway]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transcription payload

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Scoped project API key `sk-ve-v1-...` (not `ik_...`).
  responses:
    GatewayError:
      description: OpenAI-shaped error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAIError'
    RateLimited:
      description: Key RPM or upstream rate limit
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the fixed RPM window resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAIError'
  schemas:
    SystemOneRequest:
      type: object
      required: [model, state, questions]
      properties:
        model:
          type: string
          example: typesafe/jev-1.13
        state:
          description: Free-form context string, object, or array for the decision.
        questions:
          type: object
          additionalProperties: true
          description: Map of question id → typed question definition (noul / choice / score).
    SystemOneResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        answers:
          type: object
          additionalProperties: true
        usage:
          type: object
          description: OpenAI-shaped token counts (normalized from upstream input_tokens/output_tokens).
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
            cost:
              type: number
              description: Optional upstream cost (OpenRouter); not used for Vectoree billing.
    OpenAIError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
              nullable: true
            param:
              type: string
              nullable: true
