openapi: 3.0.3
info:
  title: VECTOREE Health API
  version: 1.0.0

servers:
  - url: https://vectoree.ai
    description: Production

paths:
  /api/health:
    get:
      summary: Health check
      description: Check if the API is running and healthy
      tags:
        - Client
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: "2.2.6"
                  service:
                    type: string
                    example: VECTOREE OSS Backend
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-08-18T05:30:03.375Z"